<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery - King Faisal Hospital</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
    }

    
    .header {
      background: #0b5ed7;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
    }

    
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .gallery-item img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      transition: 0.4s;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
    }

    
    .overlay {
      position: absolute;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      color: white;
      width: 100%;
      text-align: center;
      padding: 10px;
      opacity: 0;
      transition: 0.4s;
    }

    .gallery-item:hover .overlay {
      opacity: 1;
    }

    
    .footer {
      text-align: center;
      padding: 15px;
      background: #0b5ed7;
      color: white;
    }
  </style>
</head>

<body>

  
  <div class="header">
    <h1>Our Gallery</h1>
    <p>King Faisal Hospital Rwanda</p>
  </div>

  
  <div class="gallery">

    <div class="gallery-item">
      <img src="images/hospital.png" alt="">
      <div class="overlay">Hospital Building</div>
    </div>

    <div class="gallery-item">
      <img src="images/dooo.png" alt="">
      <div class="overlay">Our Doctors</div>
    </div>

    <div class="gallery-item">
      <img src="images/room.jpg" alt="">
      <div class="overlay">Surgery Room</div>
    </div>

    <div class="gallery-item">
      <img src="images/medical.jpg" alt="">
      <div class="overlay">Medical Equipment</div>
    </div>

    <div class="gallery-item">
      <img src="images/nurse.jpg" alt="">
      <div class="overlay">Nursing Staff</div>
    </div>

    <div class="gallery-item">
      <img src="images/care.jpg" alt="">
      <div class="overlay">Patient Care</div>
    </div>
    <div class="gallery-item">
      <img src="images/research.png" alt="">
      <div class="overlay">Research Staff</div>
    </div>

    <div class="gallery-item">
      <img src="images/surgery.jpg" alt="">
      <div class="overlay">surgeon staff</div>
    </div>

  </div>

  
  <div class="footer">
    <p>&copy;2026 King Faisal Hospital Rwanda | All Rights Reserved</p>
  </div>

</body>
</html>
