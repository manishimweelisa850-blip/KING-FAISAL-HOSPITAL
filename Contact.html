<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    footer {
      background: #0a4fa3;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f8fb;
}

header {
    background: #0a4fa3;
    color: white;
    padding: 20px;
    text-align: center;
    margin-top: -50px;
}

.container {
    width: 90%;
    margin: auto;
    padding: 20px;
}

.contact-info, .contact-form {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
}

h2 {
    color: #0a4fa3;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    background: #0a4fa3;
    color: white;
    border: none;
    padding: 12px;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #083b7a;
}

iframe {
    width: 100%;
    height: 300px;
    border: none;
    border-radius: 10px;
}

  body {
    text-align: center;
    margin-top: 50px;
    font-family: Arial;
  }

 

 

  
</style>




</style>
</head>

<body>

<header>
    <h1>Contact Us</h1>
    <p>King Faisal Hospital Rwanda</p>
</header>

<div class="container">

    <div class="contact-info">
        <h2>Get in Touch</h2>
        <p><strong>Address:</strong> KG 544 St, Kacyiru, Kigali</p>
        <p><strong>Phone:</strong> +250 788 123 456</p>
        <p><strong>Email:</strong> info@kfh.rw</p>
        <p><strong>Working Hours:</strong> 24/7</p>
    </div>

    <div class="contact-form">
        <h2>Send Us a Message</h2>
        <form>
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="text" placeholder="Phone Number">
            <input type="text" placeholder="Subject">
            <textarea rows="5" placeholder="Your Message"></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>

    <h2>Our Location</h2>
    <iframe 
        src="https://maps.google.com/maps?q=King%20Faisal%20Hospital%20Rwanda&t=&z=13&ie=UTF8&iwloc=&output=embed">
    </iframe>

</div>
<footer><p>&copy; 2026 King Faisal Hospital Rwanda | All Rights Reserved </p></footer>


</body>
</html> 
</body>
</html>
